<!DOCTYPE html>
<html>
<head>
<title>Products</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div>Luxury Perfume</div>
  <div class="nav-right">
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>

    <div class="cart-btn" onclick="toggleCart()">
      🛒
      <span class="cart-count" id="cartCount">0</span>
    </div>

    <button onclick="toggleDarkMode()">🌙</button>
  </div>
</header>

<h2 style="text-align:center; margin-top:20px;">Our Perfumes</h2>

<div class="products">

  <div class="product">
    <img src="https://picsum.photos/300?1">
    <h3>Rose Elegance</h3>
    <p>$50</p>
    <button onclick="addToCart('Rose Elegance',50)">Add to Cart</button>
  </div>

  <div class="product">
    <img src="https://picsum.photos/300?2">
    <h3>Ocean Breeze</h3>
    <p>$70</p>
    <button onclick="addToCart('Ocean Breeze',70)">Add to Cart</button>
  </div>

  <div class="product">
    <img src="https://picsum.photos/300?3">
    <h3>Midnight Oud</h3>
    <p>$90</p>
    <button onclick="addToCart('Midnight Oud',90)">Add to Cart</button>
  </div>

</div>

<!-- CART PANEL -->
<div class="cart-panel" id="cartPanel">
  <h3>Your Cart</h3>
  <div id="cartItems"></div>
  <div class="total">Total: $<span id="totalPrice">0</span></div>
  <button onclick="checkout()">Checkout</button>
</div>

<script src="script.js"></script>
</body>
</html>
