<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us|EDAMAME</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/contact.css">
<link rel="stylesheet" href="../css/darkmode.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
<script src="../javaScript/contact_us.js"></script>
<script src="../javaScript/darkmode.js"></script>

</head>
<body>

<!-- NAVIGATION -->
<nav>
    <div class="logo"><strong>EDAMAME</strong></div>
    <ul>
        <li><a href="../index.html">Home</a></li>
        <li><a href="services.html">Fragrances</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="Contact.html" class="active">Contact Us</a></li>
    </ul>
</nav>

<section class="contact-section">
    <form class="contact-form">
        <div class="form-row">
            <div class="form-group">
                <label for="first-name">First Name</label>
                <input type="text" id="first-name" name="first-name">
            </div>
            <div class="form-group">
                <label for="last-name">Last Name</label>
                <input type="text" id="last-name" name="last-name">
            </div>
        </div>

        <div class="form-group">
            <label for="email">Email *</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5"></textarea>
        </div>

        <div class="button-container">
            <button type="submit" onclick="contactUs()" class="send-btn">Send</button>
        </div>
    </form>
</section>

<!-- Footer-->
<footer>
    <div class="social">
        <h2 class="contact-me">Contact <span>Us</span></h2>
        <div class="icon-container">
            <a href="https://www.facebook.com/..." class="meta-link"><i class='bx bxl-meta'></i></a>
            <a href="mailto:...@gmail.com"><i class='bx bx-envelope'></i></a>
            <a href="tel:+....."><i class='bx bx-phone-call'></i></a>
            <a href="https://www.instagram.com/......"><i class='bx bxl-instagram-alt'></i></a>
        </div>
    </div>
    <p class="copyright">&copy; 2026 EDAMAME. All rights reserved.</p>
</footer>

</body>
</html>
